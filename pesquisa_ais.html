    <style>
        :root {
            --unimed-green: #004e4c;
            --bg-color: #004e4c; 
            --surface-color: #ffffff;
            --text-color: #333333;
            --star-color: #FFD700; 
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .form-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }

        .logo-container { text-align: center; margin: 0; }
        .logo-container img {
            max-width: 200px; 
            height: auto;
            margin-top: -60px; /* Puxa a logo para perto do topo do card */
            margin-bottom: -50px; /* Puxa o título para perto da logo */
            position: relative;
        }

        .card { 
            background-color: var(--surface-color); 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }

        /* Card específico do Título/Subtítulo */
        .header-card {
            text-align: center;
            padding: 30px 20px 20px 20px; /* Reduz espaços em excesso */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* Controla perfeitamente a distância entre a logo e o título */
        }

        .header-card h2 {
            color: var(--bg-color); /* Título na cor verde do background */
            margin: 0; /* Zera a margem padrão */
            font-size: 1.4rem;
        }

        .header-card p {
            color: red; /* Subtítulo em vermelho */
            margin: 5px 0 0 0; /* Espaçamento reduzido em relação ao título */
            font-size: 0.95rem;
            font-weight: 600;
        }

        .question-title { 
            font-weight: bold; 
            color: var(--unimed-green); 
            margin-bottom: 15px; 
            display: block; 
            text-align: left;
        }

        /* Estilos Select e Textarea */
        select, textarea { 
            width: 100%; padding: 14px; border: 1px solid #ccc; 
            border-radius: 6px; box-sizing: border-box; font-family: inherit; 
            font-size: 1rem; background-color: #f9f9f9;
        }
        select:focus, textarea:focus { outline: none; border-color: var(--unimed-green); }
        textarea { min-height: 100px; resize: vertical; }

        /* Estilo das Estrelas */
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 2px; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 50px; color: #d3d3d3; cursor: pointer; transition: 0.2s ease; }
        .star-rating label:hover, .star-rating label:hover ~ label,
        .star-rating input:checked ~ label, .star-rating input:checked + label { color: var(--star-color); }
        .star-rating label:active { transform: scale(1.15); }
        
        /* Estilo dos Botões Sim/Não */
        .choice-group { display: flex; gap: 10px; }
        .choice-group input[type="radio"] { display: none; }
        .choice-group label {
            flex: 1; text-align: center; padding: 14px;
            background-color: #e9ecef; border-radius: 6px;
            cursor: pointer; font-weight: bold; color: #555; transition: 0.2s ease;
        }
        .choice-group input[type="radio"]:checked + label {
            background-color: var(--unimed-green); color: white; transform: scale(1.02);
        }

        @media (max-width: 400px) { .star-rating label { font-size: 34px; } }

        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background-color: transparent;
            color: white;
            border: 2px solid white;
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 5px; 
            transition: all 0.3s ease; 
        }
        
        .submit-btn:hover { 
            background-color: white; 
            color: var(--bg-color); 
        }

        .success-message { display: none; background: white; padding: 40px; border-radius: 8px; text-align: center; color: var(--unimed-green); max-width: 600px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        #surveyForm { display: flex; flex-direction: column; gap: 15px; }          
    </style>

    <script>
        const form = document.getElementById('surveyForm');
        const submitBtn = document.getElementById('submitBtn');
        const mainContainer = document.getElementById('mainContainer');
        const successMessage = document.getElementById('successMessage');

        // COLE A SUA MESMA URL DO GOOGLE APPS SCRIPT AQUI ABAIXO:
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwfiT-jQ564pPzS2QVcjnWDTM8kODEKi9q8Z5YeEaFgKLXgTCKEzAPbw569_YQy8Y98dw/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.textContent = 'Enviando...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: new FormData(form) })
            .then(() => {
                mainContainer.style.display = 'none';
                successMessage.style.display = 'block';
                setTimeout(() => { window.location.reload(); }, 3000);
            })
            .catch(() => {
                submitBtn.textContent = 'Erro de conexão. Tente novamente.';
                submitBtn.disabled = false;
            });
        });
