<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação - AIS Sobral</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/hj0vNJp5/logo-unimed-sobral.png">
    <style>
        :root {
            --unimed-green: #004e4c;
            --bg-color: #004e4c; 
            --surface-color: #ffffff;
            --text-color: #333333;
            --star-color: #FFD700; 
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .form-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }

        .logo-container { text-align: center; margin: 0; }
        .logo-container img {
            max-width: 200px; 
            height: auto;
            margin-top: -60px;
            margin-bottom: -50px;
            position: relative;
        }

        .card { 
            background-color: var(--surface-color); 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            position: relative; 
        }

        .header-card {
            text-align: center;
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .header-card h2 {
            color: var(--bg-color);
            margin: 0;
            font-size: 1.4rem;
        }

        .header-card p {
            color: red;
            margin: 5px 0 0 0;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .question-title { 
            font-weight: bold; 
            color: var(--unimed-green); 
            margin-bottom: 15px; 
            display: block; 
            text-align: left;
        }

        .search-select-container { position: relative; width: 100%; }
        
        input[type="text"], textarea { 
            width: 100%; padding: 14px; border: 1px solid #ccc; 
            border-radius: 6px; box-sizing: border-box; font-family: inherit; 
            font-size: 1rem; background-color: #f9f9f9;
        }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--unimed-green); }
        textarea { min-height: 100px; resize: vertical; }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 999;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #333;
            border-bottom: 1px solid #f1f1f1;
        }

        .dropdown-item:hover {
            background-color: var(--unimed-green);
            color: white;
        }

        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 1px; }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label { font-size: 38px; color: #d3d3d3; cursor: pointer; transition: 0.2s ease transform 0.1s ease; }
        .star-rating label:hover, .star-rating label:hover ~ label,
        .star-rating input:checked ~ label, .star-rating input:checked + label { color: var(--star-color); }
        .star-rating label:active { transform: scale(1.15); }
        
        @media (max-width: 400px) { .star-rating label { font-size: 30px; } }
        
        .choice-group { display: flex; gap: 10px; }
        .choice-group input[type="radio"] { display: none; }
        .choice-group label {
            flex: 1; text-align: center; padding: 14px;
            background-color: #e9ecef; border-radius: 6px;
            cursor: pointer; font-weight: bold; color: #555; transition: 0.2s ease;
        }
        .choice-group input[type="radio"]:checked + label {
            background-color: var(--unimed-green); color: white; transform: scale(1.02);
        }

        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background-color: transparent;
            color: white;
            border: 2px solid white;
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 5px; 
            transition: all 0.3s ease; 
        }
        
        .submit-btn:hover { 
            background-color: white; 
            color: var(--bg-color); 
        }

        .success-message { display: none; background: white; padding: 40px; border-radius: 8px; text-align: center; color: var(--unimed-green); max-width: 600px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        #surveyForm { display: flex; flex-direction: column; gap: 15px; }          
    </style>
</head>
<body>

    <div class="form-container" id="mainContainer">
        
        <div class="card header-card" id="headerText">
            <div class="logo-container">
                <img src="https://i.postimg.cc/hj0vNJp5/logo-unimed-sobral.png" alt="Logo Unimed">
            </div>
            <h2>Pesquisa de Satisfação – AIS Sobral</h2>
            <p>Questões com asterisco são obrigatórias!</p>
        </div>

        <form id="surveyForm" autocomplete="off">
            <input type="hidden" name="local" value="AIS">

            <div class="card">
                <label class="question-title">1ª) Selecione ou pesquise o nome do profissional que lhe atendeu? *</label>
                <div class="search-select-container">
                    <input type="text" id="inputProfissional" name="profissional" placeholder="Clique para ver a lista ou digite para buscar..." required>
                    <div id="dropdownList" class="dropdown-list"></div>
                </div>
            </div>

            <div class="card">
                <label class="question-title">2ª) Qual nota você dá para os horários disponíveis para o agendamento da consulta (ou procedimento)? *</label>
                <div class="star-rating">
                    <input type="radio" id="a2_10" name="avaliacao_horario" value="10" required><label for="a2_10">★</label>
                    <input type="radio" id="a2_9" name="avaliacao_horario" value="9"><label for="a2_9">★</label>
                    <input type="radio" id="a2_8" name="avaliacao_horario" value="8"><label for="a2_8">★</label>
                    <input type="radio" id="a2_7" name="avaliacao_horario" value="7"><label for="a2_7">★</label>
                    <input type="radio" id="a2_6" name="avaliacao_horario" value="6"><label for="a2_6">★</label>
                    <input type="radio" id="a2_5" name="avaliacao_horario" value="5"><label for="a2_5">★</label>
                    <input type="radio" id="a2_4" name="avaliacao_horario" value="4"><label for="a2_4">★</label>
                    <input type="radio" id="a2_3" name="avaliacao_horario" value="3"><label for="a2_3">★</label>
                    <input type="radio" id="a2_2" name="avaliacao_horario" value="2"><label for="a2_2">★</label>
                    <input type="radio" id="a2_1" name="avaliacao_horario" value="1"><label for="a2_1">★</label>
                </div>
            </div>

            <div class="card">
                <label class="question-title">3ª) Você gostou do seu atendimento? *</label>
                <div class="choice-group">
                    <input type="radio" id="a3_sim" name="gostou_atendimento" value="Sim" required><label for="a3_sim">Sim</label>
                    <input type="radio" id="a3_nao" name="gostou_atendimento" value="Não"><label for="a3_nao">Não</label>
                </div>
            </div>

            <div class="card">
                <label class="question-title">4ª) Você recomendaria os nossos serviços? *</label>
                <div class="choice-group">
                    <input type="radio" id="a4_sim" name="recomendaria" value="Sim" required><label for="a4_sim">Sim</label>
                    <input type="radio" id="a4_nao" name="recomendaria" value="Não"><label for="a4_nao">Não</label>
                </div>
            </div>

            <div class="card">
                <label class="question-title">5ª) De modo geral, qual nota você dá aos nossos serviços? *</label>
                <div class="star-rating">
                    <input type="radio" id="a5_10" name="avaliacao_geral" value="10" required><label for="a5_10">★</label>
                    <input type="radio" id="a5_9" name="avaliacao_geral" value="9"><label for="a5_9">★</label>
                    <input type="radio" id="a5_8" name="avaliacao_geral" value="8"><label for="a5_8">★</label>
                    <input type="radio" id="a5_7" name="avaliacao_geral" value="7"><label for="a5_7">★</label>
                    <input type="radio" id="a5_6" name="avaliacao_geral" value="6"><label for="a5_6">★</label>
                    <input type="radio" id="a5_5" name="avaliacao_geral" value="5"><label for="a5_5">★</label>
                    <input type="radio" id="a5_4" name="avaliacao_geral" value="4"><label for="a5_4">★</label>
                    <input type="radio" id="a5_3" name="avaliacao_geral" value="3"><label for="a5_3">★</label>
                    <input type="radio" id="a5_2" name="avaliacao_geral" value="2"><label for="a5_2">★</label>
                    <input type="radio" id="a5_1" name="avaliacao_geral" value="1"><label for="a5_1">★</label>
                </div>
            </div>

            <div class="card">
                <label class="question-title">6ª) Sugestões, críticas ou elogios:</label>
                <textarea name="sugestoes" placeholder="Deixe aqui seu comentário..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">ENVIAR</button>
        </form>
    </div>

    <div class="success-message" id="successMessage">
        <h2>Obrigado!</h2>
        <p>Sua avaliação foi registrada e é muito importante para nós.</p>
    </div>

    <script>
        const profissionais = [
            "Alita Silva Ribeiro Arcanjo (Gerente APS)",
            "Ana Maria Abel de Sousa (Técnica de enfermagem)",
            "Antonia Ediva Lima Pereira (Serviços Gerais)",
            "Antonio Marciano T Rodrigues (Motorista)",
            "Claudiana Maria Solon Aguiar (Fisioterapeuta)",
            "Clínica De Fisioterapia",
            "Clínica Interação",
            "Daiana Marques Mouta (Neuropsicologa)",
            "Dr Sergio Lúcio Albuquerque Nóbrega (Psiquiatra)",
            "Dr. Danilo Santos Guerreiro (Pneumologista Pediátrico)",
            "Dr. Francisco Airton Rangel Filho (Ginecologista)",
            "Dr. Guilherme Porto Lustosa (Gastropediátrico)",
            "Dr. Isaac Holanda Mendes Mais (Neurologista)",
            "Dr. Joaquim Nogueira Lopes Neto (Coordenador Médico APS)",
            "Dr. Leonardo Tiago Costa dos Santos (Psiquiatra)",
            "Dr. Pedro Rubens Araújo Carvalho (Neurologista)",
            "Dr. Rafael Sousa Brito (Pneumologista Adulto)",
            "Dr. Sânkia Maria Lopes Aragão (Ultrassonografista)",
            "Dr. Tadeu Rodriguez De C. Pinheiro (Ginecologista)",
            "Dr. Vicente Cristino de Menezes Neto (Acupunturista)",
            "Dr. Yure Guimarães Azevedo (Reumatologista)",
            "DRA. LAÍS JORGE (ENDOCRINOLOGISTA)",
            "Dra. Andrea Edwigs Pinheiro Menezes Barreto (Alergologista)",
            "Dra. Dandara Vasconcelos Bevilaqua (Médica Sad)",
            "Dra. Laís Jorge Moura (Endocrinologista)",
            "Dra. Lívia Nobre (Pediatra)",
            "Dra. Nara Lívia Pereira Coutinho (Médica Fetal)",
            "Dra. Raissa Almeida Barros de Oliveira Pereira (Endocrinologista pediátrica)",
            "Dra. Sankia Maria Lopes Aragão (Médica da Família e Comunidade)",
            "Edival Bringel de Olinda (Gerente Financeiro)",
            "Edmilson Ferreira Bezerra Filho (Fisioterapeuta)",
            "Fernanda Pontes d Silva (Fonoaudióloga)",
            "Francisco Auricélio Ribeiro da Costa (Almoxarife)",
            "Francisco Kaylton Vericissimo de Sá (Fisioterapeuta)",
            "Ismael Lee da Cunha Marques (Profissional de Educação Física)",
            "Jaci Bianca Cabral Vasconcelos (Psicóloga)",
            "Jacqueline De Oliveira Lima (Coordenadora APS)",
            "Jamille Thayna Barroso Venuto (Psicóloga)",
            "Joelma Gomes Lima (Coordenadora da Clínica de Interação)",
            "Kaliane Pereira Costa (Fisioterapeuta)",
            "Kamilla Cardoso Tavares (Analista Administrativo)",
            "Keven Mendes Moreira (Fisioterapeuta)",
            "Kilvia Feitoza Ferreira (Psicóloga)",
            "Leandro Ferreira Lopes (Segurança)",
            "Leiliane Araujo Gadelha Costa (Fisioterapeuta)",
            "Márcia Regina Parente Pazin (Fisioterapeuta)",
            "MARIA JOSÉ (FONOAUDIOLOGA)",
            "Maria José Paiva de Moura (Fonoaudióloga)",
            "Marina Carvalho Nogueira Veras (Nutricionista)",
            "Monica Maria Rodrigues De Franca (Técnica De Enfermagem)",
            "Natercia Almeida Martins (Atendente)",
            "Pedro Da Silva Coelho (Serviços Gerais)",
            "Polyane Rodrigues Vasconcelos (Enfermeira)",
            "Quenia Isaias Venuto Lima (Terapeuta Ocupacional)",
            "Renata Cassemiro Feijão (Psicóloga)",
            "Rhana Mont'alverne Barreto (Fisioterapeuta)",
            "Rildon Alves da Costa (Farmacêutico)",
            "Rojelma Carneiro Ferreira (Enfermeira)",
            "Rosyane Maria C Vasconcelos Sousa (Farmacêutica)",
            "Sander Paulo Carneiro Flor (Psicólogo)",
            "Sarah Carvalho Félix (Nutricionista)",
            "Serviço De Atendimento Domiciliar – Sad",
            "Talita Ramos Bantim (Coordenadora Sad)",
            "Thaisa Quixadá Fontenele (Psicóloga)",
            "Thiago Carvalho Freitas (Psicólogo)",
            "Vinicius De Sousa Lopes (Administrativo)"
        ];

        const input = document.getElementById('inputProfissional');
        const dropdown = document.getElementById('dropdownList');

        function renderizarLista(itens) {
            dropdown.innerHTML = '';
            if (itens.length === 0) {
                dropdown.style.display = 'none';
                return;
            }
            itens.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.addEventListener('click', () => {
                    input.value = item;
                    dropdown.style.display = 'none';
                });
                dropdown.appendChild(div);
            });
            dropdown.style.display = 'block';
        }

        input.addEventListener('focus', () => {
            renderizarLista(profissionais);
        });

        input.addEventListener('input', () => {
            const termo = input.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const filtrados = profissionais.filter(p => 
                p.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(termo)
            );
            renderizarLista(filtrados);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-select-container')) {
                dropdown.style.display = 'none';
            }
        });

        const form = document.getElementById('surveyForm');
        const submitBtn = document.getElementById('submitBtn');
        const mainContainer = document.getElementById('mainContainer');
        const successMessage = document.getElementById('successMessage');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyr3bnhd0me_FBTQeogIquXV-gkIkGlW9hAvxOF211vs0OaF7FuOyMcewCTz0xukKWttQ/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.textContent = 'Enviando...';
            submitBtn.disabled = true;

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => (data[key] = value));

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(() => {
                mainContainer.style.display = 'none';
                successMessage.style.display = 'block';
                setTimeout(() => { window.location.reload(); }, 3000);
            })
            .catch(() => {
                submitBtn.textContent = 'Erro de conexão. Tente novamente.';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
